name: Deploy Najm ICUCalc to GitHub Pages

on:
  push:
    branches:
      - claude/fix-app-links-Sp24p
      - main
  workflow_dispatch:

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (root + preserve /ash, /cinemind, /design from gh-pages)
        run: |
          mkdir -p _site
          # Root Najm files
          cp index.html               _site/index.html
          cp manifest.webmanifest     _site/manifest.webmanifest
          cp sw.js                    _site/sw.js
          cp privacy-policy.html      _site/privacy-policy.html
          mkdir -p _site/icons
          cp icons/*.png              _site/icons/
          # A .nojekyll so GitHub Pages serves files starting with _ or .
          touch _site/.nojekyll
          # Preserve other projects that used to live in gh-pages root
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            for dir in ash cinemind design; do
              git archive --format=tar origin/gh-pages -- "$dir" 2>/dev/null \
                | tar -C _site -xf - 2>/dev/null || true
            done
          fi
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
