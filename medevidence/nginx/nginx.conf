worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    log_format clinical '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log clinical;

    upstream medevidence_api {
        server api:8000;
    }

    types {
        application/manifest+json webmanifest;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://medevidence_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /health {
            proxy_pass http://medevidence_api/health;
        }

        # PWA: service worker must be served with a max scope of "/".
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
            default_type application/javascript;
        }

        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=3600";
        }

        location /icons/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
