<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <title>CineMind — Discover the Movies Made for You</title>
  <meta name="description" content="Answer a few questions and let AI uncover movies and series perfectly matched to your personality." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ambient cinematic background -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__glow ambient__glow--red"></div>
    <div class="ambient__glow ambient__glow--violet"></div>
    <div class="particles" id="particles"></div>
  </div>

  <!-- App root -->
  <main id="app" class="app"></main>

  <!-- Bottom navigation (appears after onboarding) -->
  <nav class="tabbar" id="tabbar" hidden>
    <button class="tabbar__btn" data-route="results" aria-label="For You">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>For You</span>
    </button>
    <button class="tabbar__btn" data-route="features" aria-label="AI Tools">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v3m0 12v3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M3 12h3m12 0h3M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>AI Tools</span>
    </button>
    <button class="tabbar__btn tabbar__btn--surprise" data-action="surprise" aria-label="Surprise Me">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 9.2 8.6 2 9.3l5.5 4.7L5.8 21 12 17.2 18.2 21l-1.7-7 5.5-4.7-7.2-.7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <button class="tabbar__btn" data-route="watchlist" aria-label="Watchlist">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4.2L5 20V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Watchlist</span>
      <em class="tabbar__badge" id="watchlistCount" hidden>0</em>
    </button>
    <button class="tabbar__btn" data-route="badges" aria-label="Badges">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="5" stroke="currentColor" stroke-width="1.6"/><path d="m8.5 13.5-1.5 7 5-2.5 5 2.5-1.5-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Badges</span>
    </button>
  </nav>

  <!-- Modal mount -->
  <div id="modal-root"></div>

  <!-- Toast mount -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
