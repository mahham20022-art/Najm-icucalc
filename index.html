<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>SPSS Pro - كورس تحليل البيانات المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --light: #f8fafc;
            --gray: #94a3b8;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --gradient-2: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
            --gradient-3: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        input, textarea, [contenteditable] {
            -webkit-user-select: text;
            user-select: text;
        }
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior-y: none;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }
        button { font-family: inherit; -webkit-appearance: none; appearance: none; }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: var(--dark); overflow: hidden;
        }
        .bg-animation .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: float 20s infinite ease-in-out;
            will-change: transform;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; right: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; left: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--accent); top: 50%; left: 50%; animation-delay: -10s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle {
            position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 50%; animation: particle-float 15s infinite;
        }
        @keyframes particle-float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 999; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar {
            position: fixed; right: 0; top: 0; width: 300px; height: 100vh; height: 100dvh;
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1); z-index: 1000;
            transform: translateX(0); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }
        .sidebar.collapsed { transform: translateX(100%); }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .logo {
            font-size: 1.7rem; font-weight: 900; background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .logo i { font-size: 2rem; }
        .user-progress {
            margin-top: 18px; padding: 14px; background: rgba(255,255,255,0.05);
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
        }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill {
            height: 100%; background: var(--gradient-1); border-radius: 4px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
        }
        .progress-fill::after {
            content: ''; position: absolute; top: 0; right: 0; width: 20px; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3)); animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-20px); } 100% { transform: translateX(20px); } }
        .module-list { padding: 15px 12px; }
        .module-item {
            margin-bottom: 8px; border-radius: 12px; overflow: hidden;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05);
        }
        .module-item.active { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .module-header {
            padding: 14px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: all 0.3s ease; min-height: 56px;

        .module-number {
            width: 34px; height: 34px; border-radius: 10px; background: var(--gradient-1);
            display: flex; align-items: center; justify-content: center; font-weight: 700;
            font-size: 0.9rem; flex-shrink: 0;
        }
        .module-info { flex: 1; min-width: 0; }
        .module-info h4 { font-size: 0.92rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .module-info span { font-size: 0.72rem; color: var(--gray); }
        .module-status { font-size: 1rem; }
        .module-status.locked { color: var(--gray); opacity: 0.5; }
        .module-status.completed { color: var(--success); }
        .module-status.in-progress { color: var(--warning); }
        .lessons-list { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }

            padding: 12px 16px 12px 46px; cursor: pointer; display: flex; align-items: center;
            gap: 10px; font-size: 0.88rem; transition: all 0.2s ease; border-right: 3px solid transparent;
            min-height: 44px;
        }
        .lesson-item:active { background: rgba(99, 102, 241, 0.15); }
        .lesson-item.active-lesson { background: rgba(99, 102, 241, 0.15); border-right-color: var(--primary); color: var(--primary); }
        .lesson-item i { font-size: 0.78rem; width: 18px; }
        .main-content { margin-right: 300px; min-height: 100vh; transition: margin-right 0.4s ease; }
        .main-content.full { margin-right: 0; }
        .top-bar {
            position: sticky; top: var(--safe-top); z-index: 100; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }
        .toggle-sidebar {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--light); font-size: 1.1rem;
            cursor: pointer; padding: 0; border-radius: 12px; transition: all 0.3s ease;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .toggle-sidebar:active { background: var(--primary); transform: scale(0.95); }
        .breadcrumb {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
            flex: 1; min-width: 0; overflow: hidden;
        }
        .breadcrumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .breadcrumb i { color: var(--gray); font-size: 0.65rem; flex-shrink: 0; }
        .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .btn-icon {
            width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: var(--light); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .btn-icon:active { background: var(--primary); border-color: var(--primary); transform: scale(0.95); }
        .content-area { padding: 20px 18px 60px; max-width: 1200px; margin: 0 auto; }
        .hero-section { text-align: center; padding: 30px 10px 40px; position: relative; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px;
            background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px; font-size: 0.82rem; color: var(--primary); margin-bottom: 22px;
            animation: pulse 2s infinite;
        }

            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
        }
        .hero-title {
            font-size: 2.2rem; font-weight: 900; line-height: 1.2; margin-bottom: 18px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .hero-title span { background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero-subtitle { font-size: 1rem; color: var(--gray); max-width: 600px; margin: 0 auto 30px; line-height: 1.7; }
        .hero-stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 30px;
        }
        .stat-card {
            text-align: center; padding: 18px 8px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .stat-card:active { transform: scale(0.97); border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .stat-number {
            font-size: 1.6rem; font-weight: 900; background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-label { color: var(--gray); font-size: 0.78rem; margin-top: 4px; }
        .hero-cta { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-direction: column; max-width: 400px; margin-left: auto; margin-right: auto; }
        .btn {
            padding: 14px 30px; border-radius: 14px; font-family: 'Tajawal', sans-serif;
            font-size: 1rem; font-weight: 700; cursor: pointer; border: none;
            transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px;
            justify-content: center; min-height: 48px;
        }
        .btn-primary {
            background: var(--gradient-1); color: white; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:active { transform: scale(0.97); box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--light); border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:active { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: scale(0.97); }
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 22px; margin-bottom: 20px;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .card-icon {
            width: 46px; height: 46px; border-radius: 14px; background: var(--gradient-1);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            flex-shrink: 0;
        }
        .card-title { font-size: 1.15rem; font-weight: 800; }
        .lesson-content h2 {
            font-size: 1.6rem; margin-bottom: 16px; line-height: 1.3;
            background: var(--gradient-2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .lesson-content h3 { font-size: 1.2rem; margin: 24px 0 12px; color: var(--accent); }
        .lesson-content p { color: var(--gray); margin-bottom: 12px; font-size: 0.98rem; line-height: 1.8; }
        .lesson-content ul, .lesson-content ol { margin: 12px 0; padding-right: 22px; }
        .lesson-content li { margin-bottom: 8px; color: var(--gray); font-size: 0.95rem; }
        .lesson-content li::marker { color: var(--primary); }
        .highlight-box {
            background: rgba(99, 102, 241, 0.1); border-right: 4px solid var(--primary);
            padding: 16px 18px; border-radius: 0 12px 12px 0; margin: 16px 0;
        }
        .highlight-box.warning { background: rgba(245, 158, 11, 0.1); border-right-color: var(--warning); }
        .highlight-box.success { background: rgba(16, 185, 129, 0.1); border-right-color: var(--success); }
        .highlight-box strong { color: var(--light); }
        .code-block {
            background: var(--dark-light); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 30px 16px 16px; margin: 16px 0;
            font-family: 'Courier New', monospace; font-size: 0.85rem;
            overflow-x: auto; -webkit-overflow-scrolling: touch; position: relative;
            white-space: pre; direction: ltr; text-align: left;
        }
        .code-block::before {
            content: 'SPSS Syntax'; position: absolute; top: 0; left: 0; background: var(--primary);
            color: white; padding: 4px 12px; font-size: 0.7rem; border-radius: 0 0 10px 0;
            font-family: 'Tajawal', sans-serif;
        }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 16px 0; border-radius: 12px; }
        .spss-table {
            width: 100%; border-collapse: collapse; min-width: 400px;
            background: var(--dark-light); border-radius: 12px; overflow: hidden;
        }
        .spss-table th, .spss-table td {
            padding: 12px 14px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
        }
        .spss-table th { background: rgba(99, 102, 241, 0.2); font-weight: 700; color: var(--primary); }
        .quiz-container {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 22px 18px; margin: 24px 0;
        }
        .quiz-header { text-align: center; margin-bottom: 22px; }

        .quiz-progress { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

        .quiz-dot.active { background: var(--primary); transform: scale(1.3); }
        .quiz-dot.correct { background: var(--success); }
        .quiz-dot.wrong { background: var(--danger); }
        .question-card {

        }
        .question-text { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; line-height: 1.6; }
        .options-grid { display: grid; gap: 10px; }
        .option-btn {
            padding: 14px 16px; background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1); border-radius: 14px; color: var(--light);
            font-family: 'Tajawal', sans-serif; font-size: 0.95rem; cursor: pointer;
            text-align: right; transition: all 0.25s ease; display: flex; align-items: center;
            gap: 12px; min-height: 52px;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.2); }
        .option-btn.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.2); }
        .option-btn.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.2); }
        .option-letter {
            width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; font-weight: 700;
            font-size: 0.85rem; flex-shrink: 0;
        }
        .option-text { flex: 1; }
        .quiz-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
        .quiz-actions .btn { flex: 1; padding: 12px 16px; font-size: 0.95rem; }
        .quiz-result { text-align: center; padding: 30px 20px; }
        .result-icon { font-size: 4rem; margin-bottom: 16px; }

            font-size: 2.4rem; font-weight: 900; background: var(--gradient-1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .chart-container {

            padding: 18px 14px; margin: 18px 0; border: 1px solid rgba(255,255,255,0.1);
        }

        .badge-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        }

            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        @keyframes spin { to { transform: rotate(360deg); } }

    /* ======================== APP STATE ======================== */
    const STORAGE_KEY = 'spss-pro-progress-v1';
    const state = {
        currentModule: null,
        currentLesson: null,
        completed: new Set(),
        currentQuiz: null
    };

    function loadProgress() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) state.completed = new Set(JSON.parse(raw));
        } catch (e) {}
    }
    function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.completed])); } catch (e) {}
    }
    function lessonKey(mi, li) { return `${mi}:${li}`; }

    function totalLessons() {
        return COURSE.reduce((s, m) => s + m.lessons.length, 0);
    }
    function completionPercent() {
        return Math.round((state.completed.size / totalLessons()) * 100);
    }

    /* ======================== SIDEBAR ======================== */
    function renderSidebar() {
        const list = document.getElementById('moduleList');
        list.innerHTML = COURSE.map((m, mi) => {
            const lessons = m.lessons.map((l, li) => {
                const key = lessonKey(mi, li);
                const done = state.completed.has(key);
                const isActive = state.currentModule === mi && state.currentLesson === li;
                return `<div class="lesson-item ${isActive ? 'active-lesson' : ''}" data-m="${mi}" data-l="${li}">
                    <i class="fas ${done ? 'fa-check-circle' : (l.icon || 'fa-circle')}" style="color:${done ? 'var(--success)' : 'inherit'}"></i>
                    <span>${l.title}</span>
                </div>`;
            }).join('');

            const moduleDone = m.lessons.every((_, li) => state.completed.has(lessonKey(mi, li)));
            const moduleProgress = m.lessons.filter((_, li) => state.completed.has(lessonKey(mi, li))).length;
            const inProgress = moduleProgress > 0 && !moduleDone;
            const statusIcon = moduleDone ? '<i class="fas fa-check-circle module-status completed"></i>' :
                              inProgress ? '<i class="fas fa-clock module-status in-progress"></i>' :
                              '<i class="fas fa-chevron-down module-status"></i>';

            const isExpanded = state.currentModule === mi;
            return `
                <div class="module-item ${isExpanded ? 'expanded active' : ''}" data-module="${mi}">
                    <div class="module-header">
                        <div class="module-number"><i class="fas ${m.icon || 'fa-book'}"></i></div>
                        <div class="module-info">
                            <h4>${m.title}</h4>
                            <span>${m.lessons.length} درس · ${moduleProgress}/${m.lessons.length}</span>
                        </div>
                        ${statusIcon}
                    </div>
                    <div class="lessons-list">${lessons}</div>
                </div>
            `;
        }).join('');

        list.querySelectorAll('.module-header').forEach(header => {
            header.addEventListener('click', (e) => {
                const item = header.parentElement;
                const mi = parseInt(item.dataset.module);
                document.querySelectorAll('.module-item').forEach(el => {
                    if (el !== item) el.classList.remove('expanded');
                });
                item.classList.toggle('expanded');
            });
        });
        list.querySelectorAll('.lesson-item').forEach(li => {
            li.addEventListener('click', () => {
                const m = parseInt(li.dataset.m);
                const l = parseInt(li.dataset.l);
                openLesson(m, l);
            });
        });

        document.getElementById('progressPercent').textContent = completionPercent() + '%';
        document.getElementById('progressFill').style.width = completionPercent() + '%';
    }

            <div class="card fade-in">
                <div class="card-header">
                    <div class="card-icon" style="background: var(--gradient-3)"><i class="fas fa-graduation-cap"></i></div>
                    <div class="card-title">منهج الكورس</div>
                </div>
                <div class="timeline">
                    ${COURSE.map((m, i) => {
                        const done = m.lessons.every((_, li) => state.completed.has(lessonKey(i, li)));
                        return `<div class="timeline-item">
                            <div class="timeline-dot ${done ? 'completed' : ''}"></div>
                            <div class="timeline-content">
                                <h4>${m.title} ${done ? '<span class="badge badge-success"><i class="fas fa-check"></i> مكتمل</span>' : ''}</h4>
                                <p>${m.subtitle} · ${m.lessons.length} دروس</p>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `;
        document.getElementById('contentArea').innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ======================== LESSON PAGE ======================== */
    function openLesson(mi, li) {
        state.currentModule = mi;
        state.currentLesson = li;
        const module = COURSE[mi];
        const lesson = module.lessons[li];

        document.getElementById('breadcrumb').innerHTML = `
            <span onclick="app.home()" style="cursor:pointer;color:var(--gray)">الرئيسية</span>
            <i class="fas fa-chevron-left"></i>
            <span style="color:var(--gray)">${module.title}</span>
            <i class="fas fa-chevron-left"></i>
            <span>${lesson.title}</span>
        `;

        const isLast = mi === COURSE.length - 1 && li === module.lessons.length - 1;
        const hasNext = !(isLast);
        const hasPrev = !(mi === 0 && li === 0);
        const key = lessonKey(mi, li);
        const isDone = state.completed.has(key);

        const content = `
            <article class="lesson-content fade-in">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap">
                    <span class="badge badge-primary"><i class="fas fa-book"></i> ${module.title}</span>
                    <span class="badge ${isDone ? 'badge-success' : 'badge-warning'}">
                        <i class="fas ${isDone ? 'fa-check' : 'fa-clock'}"></i>
                        ${isDone ? 'مكتمل' : 'قيد الدراسة'}
                    </span>
                </div>
                ${lesson.body}
                ${lesson.isQuiz ? renderQuizContainer(lesson.quiz) : ''}
                <div class="lesson-nav">
                    <button class="nav-btn prev" onclick="app.prevLesson()" ${hasPrev ? '' : 'disabled'}>
                        <i class="fas fa-arrow-right"></i> السابق
                    </button>
                    ${!lesson.isQuiz ? `<button class="nav-btn" onclick="app.markComplete()">
                        <i class="fas ${isDone ? 'fa-check-double' : 'fa-check'}"></i>
                        ${isDone ? 'مكتمل' : 'وضع كمكتمل'}
                    </button>` : ''}
                    <button class="nav-btn next" onclick="app.nextLesson()" ${hasNext ? '' : 'disabled'}>
                        ${isLast ? 'إنهاء الكورس' : 'التالي'} <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
            </article>
        `;
        document.getElementById('contentArea').innerHTML = content;

        bindTabs();
        bindOptionTabs();
        if (lesson.onRender) lesson.onRender();

        renderSidebar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.innerWidth <= 1024) closeSidebar();
    }

    function renderQuizContainer(quiz) {
        state.currentQuiz = { questions: quiz, current: 0, answers: [], finished: false };
        return `
            <div class="quiz-container" id="quizContainer">
                <div class="quiz-header">
                    <h3>اختبار التخرج النهائي</h3>
                    <p style="color:var(--gray);font-size:0.9rem">${quiz.length} أسئلة · النجاح من 70%</p>
                    <div class="quiz-progress">${quiz.map((_, i) => `<div class="quiz-dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('')}</div>
                </div>
                <div id="quizBody"></div>
            </div>
        `;
    }

    function renderQuizQuestion() {
        const q = state.currentQuiz.questions[state.currentQuiz.current];
        const i = state.currentQuiz.current;
        const total = state.currentQuiz.questions.length;
        const isLast = i === total - 1;
        const html = `
            <div class="question-card fade-in">
                <div style="font-size:0.85rem;color:var(--gray);margin-bottom:6px">السؤال ${i+1} من ${total}</div>
                <div class="question-text">${q.q}</div>
                <div class="options-grid">
                    ${q.opts.map((o, oi) => `
                        <button class="option-btn" data-i="${oi}">
                            <span class="option-letter">${['أ','ب','ج','د'][oi]}</span>
                            <span class="option-text">${o}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="quiz-actions">
                    <button class="btn btn-secondary" onclick="app.prevQuestion()" ${i === 0 ? 'disabled' : ''}><i class="fas fa-arrow-right"></i> السابق</button>
                    <button class="btn btn-primary" id="quizNextBtn" disabled onclick="app.nextQuestion()">${isLast ? 'إنهاء' : 'التالي'} <i class="fas fa-arrow-left"></i></button>
                </div>
            </div>
        `;
        document.getElementById('quizBody').innerHTML = html;

        document.querySelectorAll('.quiz-dot').forEach((d, di) => {
            d.classList.toggle('active', di === i);
            const ans = state.currentQuiz.answers[di];
            if (ans !== undefined) {
                d.classList.toggle('correct', ans.correct);
                d.classList.toggle('wrong', !ans.correct);
            }
        });

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('quizNextBtn').disabled = false;
            });
        });
    }

    function submitQuestion() {
        const selected = document.querySelector('.option-btn.selected');
        if (!selected) return false;
        const i = state.currentQuiz.current;
        const ans = parseInt(selected.dataset.i);
        const correct = ans === state.currentQuiz.questions[i].correct;
        state.currentQuiz.answers[i] = { ans, correct };

        document.querySelectorAll('.option-btn').forEach((b, oi) => {
            if (oi === state.currentQuiz.questions[i].correct) b.classList.add('correct');
            if (oi === ans && !correct) b.classList.add('wrong');
            b.style.pointerEvents = 'none';
        });
        return true;
    }

    function showQuizResult() {
        const correct = state.currentQuiz.answers.filter(a => a && a.correct).length;
        const total = state.currentQuiz.questions.length;
        const score = Math.round((correct / total) * 100);
        const passed = score >= 70;

        document.getElementById('quizBody').innerHTML = `
            <div class="quiz-result fade-in">
                <div class="result-icon">${passed ? '🏆' : '💪'}</div>
                <div class="result-score">${score}%</div>
                <h3 style="margin:14px 0">${passed ? 'مبروك! نجحت بتفوق' : 'حاول مرة أخرى'}</h3>
                <p style="color:var(--gray);margin-bottom:18px">أجبت بشكل صحيح على ${correct} من ${total}</p>
                ${passed ? '<p style="color:var(--success);font-weight:700">🎓 تستحق شهادة إتمام كورس SPSS Pro</p>' : ''}
                <div style="margin-top:22px;display:flex;gap:10px;flex-direction:column">
                    <button class="btn btn-primary" onclick="app.restartQuiz()"><i class="fas fa-redo"></i> إعادة الاختبار</button>
                    <button class="btn btn-secondary" onclick="app.home()"><i class="fas fa-home"></i> العودة للرئيسية</button>
                </div>
            </div>
        `;

        if (passed) {
            state.completed.add(lessonKey(state.currentModule, state.currentLesson));
            saveProgress();
            renderSidebar();
            launchConfetti();
        }
    }

    /* ======================== TABS ======================== */
    function bindTabs() {
        const tabs = document.querySelectorAll('.tabs');
        tabs.forEach(group => {
            group.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    group.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const targetId = tab.dataset.tab;
                    const parent = group.parentElement;
                    parent.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    const target = parent.querySelector('#' + targetId);
                    if (target) target.classList.add('active');
                });
            });
        });
    }
    function bindOptionTabs() { /* placeholder */ }

    /* ======================== CHARTS ======================== */
    let charts = [];
    function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }

    function chartDefaults() {
        return {
            color: '#94a3b8',
            font: { family: 'Tajawal, sans-serif' }
        };
    }

    function renderCentralChart() {
        const ctx = document.getElementById('centralChart');
        if (!ctx) return;
        destroyCharts();
        const data = [3, 5, 6, 7, 7, 8, 9, 10, 12, 50];
        charts.push(new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map((_, i) => 'ق' + (i+1)),
                datasets: [{ label: 'القيم', data, backgroundColor: 'rgba(99, 102, 241, 0.6)', borderColor: '#6366f1', borderWidth: 2, borderRadius: 6 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'Tajawal' } } } },
                scales: {
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                }
            }
        }));
    }

    function renderFreqChart() {
        const ctx = document.getElementById('freqChart');
        if (!ctx) return;
        destroyCharts();
        charts.push(new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['ضعيف', 'مقبول', 'جيد', 'جيد جداً', 'ممتاز'],
                datasets: [{ label: 'عدد الطلاب', data: [4, 12, 28, 35, 21], backgroundColor: ['#ef4444','#f59e0b','#06b6d4','#6366f1','#10b981'], borderRadius: 8 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.1)' }, beginAtZero: true },
                    x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                }
            }
        }));
    }

    function renderCorrChart() {
        const ctx = document.getElementById('corrChart');
        if (!ctx) return;
        destroyCharts();
        const positive = Array.from({length: 20}, (_, i) => ({ x: i, y: i + Math.random()*4 }));
        const negative = Array.from({length: 20}, (_, i) => ({ x: i, y: 20 - i + Math.random()*4 }));
        const none = Array.from({length: 20}, () => ({ x: Math.random()*20, y: Math.random()*20 }));
        charts.push(new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    { label: 'موجب', data: positive, backgroundColor: '#10b981' },
                    { label: 'سالب', data: negative, backgroundColor: '#ef4444' },
                    { label: 'لا يوجد', data: none, backgroundColor: '#94a3b8' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'Tajawal' } } } },
                scales: {
                    y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                }
            }
        }));
    }

    /* ======================== EFFECTS ======================== */
    function launchConfetti() {
        const colors = ['#6366f1', '#ec4899', '#06b6d4', '#10b981', '#f59e0b'];
        for (let i = 0; i < 60; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + '%';
            c.style.background = colors[i % colors.length];
            c.style.animationDelay = (Math.random() * 0.5) + 's';
            c.style.animationDuration = (2 + Math.random() * 2) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 4000);
        }
    }

    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = (Math.random() * 15) + 's';
            p.style.animationDuration = (10 + Math.random() * 15) + 's';
            container.appendChild(p);
        }
    }

    /* ======================== SIDEBAR HANDLING ======================== */
    function isMobile() { return window.innerWidth <= 1024; }

    function openSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        const main = document.getElementById('mainContent');
        if (isMobile()) {
            sb.classList.add('open');
            sb.classList.remove('collapsed');
            ov.classList.add('active');
        } else {
            sb.classList.remove('collapsed');
            main.classList.remove('full');
        }
    }

    function closeSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        const main = document.getElementById('mainContent');
        if (isMobile()) {
            sb.classList.remove('open');
            sb.classList.add('collapsed');
            ov.classList.remove('active');
        } else {
            sb.classList.add('collapsed');
            main.classList.add('full');
        }
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        if (isMobile()) {
            if (sb.classList.contains('open')) closeSidebar(); else openSidebar();
        } else {
            if (sb.classList.contains('collapsed')) openSidebar(); else closeSidebar();
        }
    }

    /* ======================== APP API ======================== */
    const app = window.app = {
        home() { renderHome(); renderSidebar(); },
        startLearning() {
            const firstUndone = findFirstUndone();
            openLesson(firstUndone.m, firstUndone.l);
        },
        openSidebar,
        closeSidebar,
        markComplete() {
            const k = lessonKey(state.currentModule, state.currentLesson);
            if (state.completed.has(k)) {
                state.completed.delete(k);
            } else {
                state.completed.add(k);
                if (completionPercent() === 100) launchConfetti();
            }
            saveProgress();
            openLesson(state.currentModule, state.currentLesson);
        },
        nextLesson() {
            let m = state.currentModule, l = state.currentLesson;
            if (l + 1 < COURSE[m].lessons.length) l++;
            else if (m + 1 < COURSE.length) { m++; l = 0; }
            else { Swal.fire({ icon: 'success', title: 'مبروك!', text: 'وصلت لنهاية الكورس', confirmButtonText: 'العودة للرئيسية', background: '#1e293b', color: '#f8fafc' }).then(() => app.home()); return; }
            openLesson(m, l);
        },
        prevLesson() {
            let m = state.currentModule, l = state.currentLesson;
            if (l > 0) l--;
            else if (m > 0) { m--; l = COURSE[m].lessons.length - 1; }
            else return;
            openLesson(m, l);
        },
        nextQuestion() {
            if (!submitQuestion()) return;
            setTimeout(() => {
                const i = state.currentQuiz.current;
                if (i + 1 >= state.currentQuiz.questions.length) showQuizResult();
                else { state.currentQuiz.current++; renderQuizQuestion(); }
            }, 800);
        },
        prevQuestion() {
            if (state.currentQuiz.current > 0) { state.currentQuiz.current--; renderQuizQuestion(); }
        },
        restartQuiz() { openLesson(state.currentModule, state.currentLesson); },
        showStats() {
            const total = totalLessons();
            const done = state.completed.size;
            const pct = completionPercent();
            const moduleStats = COURSE.map((m, mi) => {
                const c = m.lessons.filter((_, li) => state.completed.has(lessonKey(mi, li))).length;
                return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.1)">
                    <span>${m.title}</span><span style="color:${c === m.lessons.length ? 'var(--success)' : 'var(--gray)'}">${c}/${m.lessons.length}</span>
                </div>`;
            }).join('');
            Swal.fire({
                title: '<i class="fas fa-trophy" style="color:#f59e0b"></i> إحصائياتي',
                html: `
                    <div style="text-align:center;padding:14px 0">
                        <div style="font-size:3rem;font-weight:900;background:linear-gradient(135deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${pct}%</div>
                        <div style="color:#94a3b8;font-size:0.95rem;margin-bottom:14px">${done} من ${total} درس</div>
                        <div style="text-align:right;font-size:0.9rem">${moduleStats}</div>
                    </div>
                `,
                background: '#1e293b', color: '#f8fafc', confirmButtonText: 'إغلاق',
                confirmButtonColor: '#6366f1'
            });
        },
        resetProgress() {
            Swal.fire({
                title: 'هل أنت متأكد؟', text: 'سيتم مسح كل تقدمك في الكورس',
                icon: 'warning', showCancelButton: true,
                confirmButtonText: 'نعم، امسح', cancelButtonText: 'إلغاء',
                confirmButtonColor: '#ef4444', cancelButtonColor: '#6366f1',
                background: '#1e293b', color: '#f8fafc'
            }).then(r => {
                if (r.isConfirmed) {
                    state.completed.clear();
                    saveProgress();
                    renderSidebar();
                    if (state.currentModule === null) renderHome();
                    else openLesson(state.currentModule, state.currentLesson);
                    Swal.fire({ icon: 'success', title: 'تم!', text: 'تم إعادة تعيين تقدمك', timer: 1500, showConfirmButton: false, background: '#1e293b', color: '#f8fafc' });
                }
            });
        }
    };

    function findFirstUndone() {
        for (let mi = 0; mi < COURSE.length; mi++) {
            for (let li = 0; li < COURSE[mi].lessons.length; li++) {
                if (!state.completed.has(lessonKey(mi, li))) return { m: mi, l: li };
            }
        }
        return { m: 0, l: 0 };
    }

    /* ======================== INIT ======================== */
    function init() {
        loadProgress();
        createParticles();
        renderSidebar();
        renderHome();

        document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);
        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

        // Close sidebar on resize from mobile to desktop
        window.addEventListener('resize', () => {
            if (!isMobile()) {
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        });

        // Prevent iOS double-tap zoom on buttons
        let lastTouch = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouch <= 350 && e.target.closest('button, .lesson-item, .module-header, .option-btn, .tab')) {
                e.preventDefault();
                e.target.click();
            }
            lastTouch = now;
        }, { passive: false });

        // Hide loader
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
        }, 600);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
    </script>
</body>
</html>
