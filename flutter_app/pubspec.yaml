name: najm_icucalc
description: Najm ICUCalc — bedside ICU/CCU clinical assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State + persistence
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Firebase (guarded — safe to keep even without google-services.json until
  # `flutterfire configure` is run; call sites are wrapped in try/catch)
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Icons (run: `flutter pub run flutter_launcher_icons`)
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon-1024.png"
  adaptive_icon_background: "#0284c7"
  adaptive_icon_foreground: "assets/icons/icon-foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
